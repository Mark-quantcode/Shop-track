<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://inugsmnlodvfsbkpxuyb.supabase.co; connect-src 'self' https://inugsmnlodvfsbkpxuyb.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'; manifest-src 'self'; worker-src 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="icon-192.png">
<title>Online shop</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#16202a;--mut:#6b7785;--pri:#0f766e;--bad:#c2410c;--ok:#15803d;--line:#e3e8ee}
@media(prefers-color-scheme:dark){:root{--bg:#10151a;--card:#1a2129;--ink:#eef2f6;--mut:#93a1b0;--pri:#2dd4bf;--bad:#fb923c;--ok:#4ade80;--line:#2a343f}}
*{box-sizing:border-box}
body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.live-bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blob{position:absolute;width:70vmax;height:70vmax;border-radius:50%;opacity:.28;animation:drift 22s ease-in-out infinite alternate}
.b1{background:radial-gradient(circle,#14b8a6 0%,transparent 65%);top:-25vmax;left:-20vmax}
.b2{background:radial-gradient(circle,#fb923c 0%,transparent 65%);bottom:-30vmax;right:-25vmax;animation-duration:28s;animation-delay:-8s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(8vmax,6vmax) scale(1.12)}100%{transform:translate(-6vmax,10vmax) scale(.95)}}
@media(prefers-color-scheme:dark){.blob{opacity:.2}}
@media(prefers-reduced-motion:reduce){.blob{animation:none}}
.hero{background:linear-gradient(135deg,#0f766e,#134e4a);color:#fff;padding:22px 16px 18px}
.hero .in{max-width:640px;margin:auto}
.hero img{width:44px;height:44px;border-radius:12px;display:block;margin-bottom:8px}
.hero h1{margin:0;font-size:24px}
.hero p{margin:4px 0 0;opacity:.85;font-size:14px}
.hero a{color:#fff;opacity:.9;font-size:13px;display:inline-block;margin-bottom:10px}
main{max-width:640px;margin:auto;padding:14px}
input{width:100%;padding:12px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin-bottom:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;-webkit-overflow-scrolling:touch}
.chips button{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px}
.chips button.on{background:var(--pri);border-color:var(--pri);color:#fff}
@media(prefers-color-scheme:dark){.chips button.on{color:#06201d}}
.item{background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.pic{width:72px;height:72px;border-radius:10px;object-fit:cover;flex:none;display:block}
.pic.ph{display:flex;align-items:center;justify-content:center;background:var(--bg);font-size:30px}
.mid{flex:1;min-width:0}
.item b{font-size:17px}
.item small{display:block;color:var(--mut);margin-top:2px}
.price{font-size:18px;font-weight:700;color:var(--pri);white-space:nowrap}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;margin-top:6px}
.tag.ok{background:#dcfce7;color:#166534}.tag.no{background:#fee2e2;color:#991b1b}
a.ord{display:inline-block;margin-top:8px;padding:8px 12px;border-radius:8px;background:#16a34a;color:#fff;text-decoration:none;font-size:14px;font-weight:600}
.moreb{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;margin:6px 0 12px}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
footer{text-align:center;color:var(--mut);font-size:12px;padding:20px}
footer a{color:var(--pri)}
</style>
</head>
<body>
<div class="live-bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i></div>
<div id="hero"></div>
<main>
  <div id="ctl" hidden>
    <input id="q" type="search" placeholder="Search items…" oninput="onSearch(this.value)" autocomplete="off">
    <div id="chips"></div>
  </div>
  <div id="list"><div class="empty">Loading shop…</div></div>
</main>
<footer>Powered by Brinvoq · <a href="market.html">Browse the marketplace</a></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://inugsmnlodvfsbkpxuyb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_cj84eL5811FNFUBZ-xtAXw_5A7-w4KX';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{persistSession:false, autoRefreshToken:false, detectSessionInUrl:false}});
// only ever show photos that live in our own storage folder
const IMG_PREFIX = SUPABASE_URL + '/storage/v1/object/public/listing-images/';
const safeImg = u => (typeof u === 'string' && u.startsWith(IMG_PREFIX)) ? u : '';
const CATS = [['Groceries','🛒'],['Fruits & Vegetables','🥬'],['Drinks','🥤'],['Household','🧴'],['Electronics','🔌'],['Phones & Accessories','📱'],['Clothing & Shoes','👕'],['Beauty & Health','💄'],['Hardware & Tools','🔧'],['Stationery & School','✏️'],['Other','📦']];
const catIcon = n => (CATS.find(c => c[0] === n) || CATS[CATS.length - 1])[1];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => 'KSh ' + Number(n || 0).toLocaleString('en-KE', {maximumFractionDigits:2});
const $ = id => document.getElementById(id);
const owner = new URLSearchParams(location.search).get('s');
const PAGE = 30;
let shop = null, items = [], counts = [], more = false, busy = false, seq = 0, timer;
let q = '', cat = '', demo = false, err = '';

const DEMO = [
  {id:1, name:'Rice 2kg', description:'Pishori, long grain', price:380, in_stock:true, category:'Groceries'},
  {id:2, name:'Cooking oil 1L', description:'', price:310, in_stock:true, category:'Groceries'},
  {id:3, name:'Soda 500ml', description:'Assorted', price:60, in_stock:true, category:'Drinks'},
  {id:4, name:'Bread (white)', description:'Fresh daily', price:70, in_stock:false, category:'Groceries'}
];

function heroHtml(){
  return `<div class="hero"><div class="in"><a href="market.html">← Marketplace</a><img src="icon-192.png" alt=""><h1>${esc(shop.name)}</h1>
    <p>${demo ? 'SAMPLE SHOP: open your own shop link to see your real items' : (shop.category ? catIcon(shop.category) + ' ' + esc(shop.category) + ' · ' : '') + 'Order on WhatsApp'}</p></div></div>`;
}
function chipsHtml(){
  if (counts.length < 2) return '';
  return `<div class="chips"><button class="${cat ? '' : 'on'}" onclick="pickCat('')">All</button>${counts.map(c => `<button class="${cat === c.category ? 'on' : ''}" data-c="${esc(c.category)}" onclick="pickCat(this.dataset.c)">${catIcon(c.category)} ${esc(c.category)}</button>`).join('')}</div>`;
}
function itemHtml(i){
  const phone = (shop.phone || '').replace(/\D/g, '');
  const img = safeImg(i.image_url);
  return `<div class="item">
    ${img ? `<img class="pic" src="${esc(img)}" alt="" loading="lazy">` : `<div class="pic ph">${catIcon(i.category)}</div>`}
    <div class="mid"><b>${esc(i.name)}</b>${i.description ? `<small>${esc(i.description)}</small>` : ''}
    <span class="tag ${i.in_stock ? 'ok' : 'no'}">${i.in_stock ? 'In stock' : 'Out of stock'}</span>
    ${phone && i.in_stock ? `<br><a class="ord" target="_blank" rel="noopener noreferrer" href="https://wa.me/${phone}?text=${encodeURIComponent(`Hi ${shop.name}, I'd like to order: ${i.name} (${money(i.price)})`)}">Order on WhatsApp</a>` : ''}</div>
    <div class="price">${money(i.price)}</div></div>`;
}
function view(){
  $('chips').innerHTML = chipsHtml();
  if (err) { $('list').innerHTML = `<div class="empty">Could not load this shop. Please try again later.<br><small>${esc(err)}</small></div>`; return; }
  $('list').innerHTML = items.map(itemHtml).join('')
    + (busy ? '<div class="empty">Loading…</div>' : (!items.length ? `<div class="empty">${q.trim() || cat ? 'No items match.' : 'No items listed yet. Check back soon.'}</div>` : ''))
    + (more && !busy ? `<button class="moreb" onclick="fetchItems(false)">Show more</button>` : '');
}

async function fetchItems(reset){
  const my = ++seq;
  if (reset) { items = []; more = false; }
  busy = true; view();
  let data;
  if (demo) {
    const t = q.trim().toLowerCase();
    data = DEMO.filter(i => (!cat || i.category === cat) && (!t || i.name.toLowerCase().includes(t)));
  } else {
    let qy = sb.from('listings').select('id,name,description,price,in_stock,category,image_url').eq('owner', owner);
    if (cat === 'Other') qy = qy.or('category.eq.Other,category.is.null'); else if (cat) qy = qy.eq('category', cat);
    const term = q.replace(/[%_\\,()]/g, ' ').trim();
    if (term) qy = qy.ilike('name', '%' + term + '%');
    qy = qy.order('in_stock', {ascending:false}).order('name').order('id').range(items.length, items.length + PAGE - 1);
    const r = await qy;
    if (my !== seq) return;
    if (r.error) { busy = false; err = r.error.message; view(); return; }
    data = r.data;
  }
  busy = false; err = '';
  items = items.concat(data); more = !demo && data.length === PAGE; view();
}
function onSearch(v){ q = v; clearTimeout(timer); timer = setTimeout(() => fetchItems(true), 300); }
function pickCat(c){ cat = c; fetchItems(true); }

async function init(){
  if (!owner || owner === 'demo') {
    demo = true; shop = {name:'Sample Mini Mart', phone:'254700000000', category:'Groceries'};
    const m = {}; DEMO.forEach(i => m[i.category] = (m[i.category] || 0) + 1);
    counts = Object.entries(m).map(([category, n]) => ({category, n}));
  } else {
    const s = await sb.from('shops').select('name,phone,category').eq('owner', owner).maybeSingle();
    if (s.error) { $('list').innerHTML = `<div class="empty">Could not load this shop. Please try again later.<br><small>${esc(s.error.message)}</small></div>`; return; }
    if (!s.data) { $('list').innerHTML = '<div class="empty">Shop not found.</div>'; return; }
    shop = s.data;
    const c = await sb.rpc('shop_category_counts', {p_owner: owner});
    counts = c.error ? [] : c.data;
  }
  $('hero').innerHTML = heroHtml(); $('ctl').hidden = false; document.title = shop.name;
  await fetchItems(true);
}
init();
</script>
</body>
</html>
