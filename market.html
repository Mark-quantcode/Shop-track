<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://inugsmnlodvfsbkpxuyb.supabase.co; connect-src 'self' https://inugsmnlodvfsbkpxuyb.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'; manifest-src 'self'; worker-src 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="icon-192.png">
<title>Brinvoq Marketplace</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#16202a;--mut:#6b7785;--pri:#0f766e;--bad:#c2410c;--ok:#15803d;--line:#e3e8ee}
@media(prefers-color-scheme:dark){:root{--bg:#10151a;--card:#1a2129;--ink:#eef2f6;--mut:#93a1b0;--pri:#2dd4bf;--bad:#fb923c;--ok:#4ade80;--line:#2a343f}}
*{box-sizing:border-box}
body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.live-bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blob{position:absolute;width:70vmax;height:70vmax;border-radius:50%;opacity:.28;animation:drift 22s ease-in-out infinite alternate}
.b1{background:radial-gradient(circle,#14b8a6 0%,transparent 65%);top:-25vmax;left:-20vmax}
.b2{background:radial-gradient(circle,#fb923c 0%,transparent 65%);bottom:-30vmax;right:-25vmax;animation-duration:28s;animation-delay:-8s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(8vmax,6vmax) scale(1.12)}100%{transform:translate(-6vmax,10vmax) scale(.95)}}
@media(prefers-color-scheme:dark){.blob{opacity:.2}}
@media(prefers-reduced-motion:reduce){.blob{animation:none}}
.hero{background:linear-gradient(135deg,#0f766e,#134e4a);color:#fff;padding:22px 16px 18px}
.hero .in{max-width:640px;margin:auto}
.hero img{width:44px;height:44px;border-radius:12px;display:block;margin-bottom:8px}
.hero h1{margin:0;font-size:24px}
.hero p{margin:4px 0 0;opacity:.85;font-size:14px}
main{max-width:640px;margin:auto;padding:14px}
input{width:100%;padding:12px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin-bottom:12px}
h2{font-size:18px;margin:16px 0 8px}
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cat{background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:16px 10px;text-align:center;color:var(--ink);font-size:15px;font-weight:600}
.cat span{display:block;font-size:30px;margin-bottom:6px}
.cat small{display:block;color:var(--mut);font-weight:400;margin-top:2px}
.back{background:none;border:0;color:var(--pri);font-size:15px;font-weight:600;padding:4px 0 10px}
.item,.shopcard{background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.shopcard{text-decoration:none;color:var(--ink)}
.pic{width:72px;height:72px;border-radius:10px;object-fit:cover;flex:none;display:block}
.pic.ph{display:flex;align-items:center;justify-content:center;background:var(--bg);font-size:30px}
.mid{flex:1;min-width:0}
.item b,.shopcard b{font-size:17px}
.item small,.shopcard small{display:block;color:var(--mut);margin-top:2px}
.item small a{color:var(--pri)}
.price{font-size:18px;font-weight:700;color:var(--pri);white-space:nowrap}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;margin-top:6px}
.tag.ok{background:#dcfce7;color:#166534}.tag.no{background:#fee2e2;color:#991b1b}
a.ord{display:inline-block;margin-top:8px;padding:8px 12px;border-radius:8px;background:#16a34a;color:#fff;text-decoration:none;font-size:14px;font-weight:600}
.moreb{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;margin:6px 0 12px}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
footer{text-align:center;color:var(--mut);font-size:12px;padding:20px}
footer a{color:var(--pri)}
</style>
</head>
<body>
<div class="live-bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i></div>
<div class="hero"><div class="in"><img src="icon-192.png" alt=""><h1>Brinvoq Marketplace</h1><p>Find what you need from local sellers</p></div></div>
<main>
  <input id="q" type="search" placeholder="Search products or shops…" oninput="onSearch(this.value)" autocomplete="off">
  <div id="root"><div class="empty">Loading…</div></div>
</main>
<footer>Powered by Brinvoq · <a href="index.html">Sell here</a></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://inugsmnlodvfsbkpxuyb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_cj84eL5811FNFUBZ-xtAXw_5A7-w4KX';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{persistSession:false, autoRefreshToken:false, detectSessionInUrl:false}});
// only ever show photos that live in our own storage folder
const IMG_PREFIX = SUPABASE_URL + '/storage/v1/object/public/listing-images/';
const safeImg = u => (typeof u === 'string' && u.startsWith(IMG_PREFIX)) ? u : '';
const CATS = [['Groceries','🛒'],['Fruits & Vegetables','🥬'],['Drinks','🥤'],['Household','🧴'],['Electronics','🔌'],['Phones & Accessories','📱'],['Clothing & Shoes','👕'],['Beauty & Health','💄'],['Hardware & Tools','🔧'],['Stationery & School','✏️'],['Other','📦']];
const catIcon = n => (CATS.find(c => c[0] === n) || CATS[CATS.length - 1])[1];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => 'KSh ' + Number(n || 0).toLocaleString('en-KE', {maximumFractionDigits:2});
const PAGE = 30, SPAGE = 20;
let cat = '', q = '', items = [], more = false, busy = false, seq = 0, timer;
let counts = [], shopsList = [], shopsMore = false, err = '';

function itemCard(i){
  const phone = (i.shop_phone || '').replace(/\D/g, '');
  const img = safeImg(i.image_url);
  return `<div class="item">
    ${img ? `<img class="pic" src="${esc(img)}" alt="" loading="lazy">` : `<div class="pic ph">${catIcon(i.category)}</div>`}
    <div class="mid"><b>${esc(i.name)}</b>${i.description ? `<small>${esc(i.description)}</small>` : ''}
    <small>Sold by <a href="shop.html?s=${esc(i.owner)}">${esc(i.shop_name)}</a></small>
    <span class="tag ${i.in_stock ? 'ok' : 'no'}">${i.in_stock ? 'In stock' : 'Out of stock'}</span>
    ${phone && i.in_stock ? `<br><a class="ord" target="_blank" rel="noopener noreferrer" href="https://wa.me/${phone}?text=${encodeURIComponent(`Hi ${i.shop_name}, I found "${i.name}" (${money(i.price)}) on Brinvoq and would like to order.`)}">Order on WhatsApp</a>` : ''}</div>
    <div class="price">${money(i.price)}</div></div>`;
}
function shopCard(s){
  return `<a class="shopcard" href="shop.html?s=${esc(s.owner)}"><div class="pic ph">${catIcon(s.category)}</div>
    <div class="mid"><b>${esc(s.name)}</b><small>${esc(s.category || 'Other')}</small></div></a>`;
}

function view(){
  const root = document.getElementById('root');
  if (err) { root.innerHTML = `<div class="empty">Could not load the marketplace. Please try again later.<br><small>${esc(err)}</small></div>`; return; }
  if (cat || q.trim()) {
    root.innerHTML = `<button class="back" onclick="goHome()">← All categories</button>` +
      (cat ? `<h2>${catIcon(cat)} ${esc(cat)}</h2>` : '<h2>Results</h2>') +
      items.map(itemCard).join('') +
      (busy ? '<div class="empty">Loading…</div>' : (!items.length ? '<div class="empty">No items match.</div>' : '')) +
      (more && !busy ? `<button class="moreb" onclick="fetchItems(false)">Show more</button>` : '');
    return;
  }
  root.innerHTML = `<h2>Shop by category</h2>` +
    (counts.length ? `<div class="cats">${counts.map(c => `<button class="cat" data-c="${esc(c.category)}" onclick="pickCat(this.dataset.c)"><span>${catIcon(c.category)}</span>${esc(c.category)}<small>${c.n} item${c.n === 1 ? '' : 's'}</small></button>`).join('')}</div>`
                   : '<div class="empty">No items listed yet. Check back soon.</div>') +
    (shopsList.length ? `<h2>Shops</h2>${shopsList.map(shopCard).join('')}${shopsMore ? `<button class="moreb" onclick="moreShops()">Show more shops</button>` : ''}` : '');
}

async function fetchItems(reset){
  const my = ++seq;
  if (reset) { items = []; more = false; }
  busy = true; view();
  const {data, error} = await sb.rpc('market_items', {p_q: q.trim() || null, p_cat: cat || null, p_lim: PAGE, p_off: items.length});
  if (my !== seq) return;
  busy = false;
  if (error) { err = error.message; view(); return; }
  err = ''; items = items.concat(data); more = data.length === PAGE; view();
}
function onSearch(v){
  q = v; clearTimeout(timer);
  timer = setTimeout(() => {
    if (q.trim() || cat) fetchItems(true);
    else { seq++; busy = false; items = []; view(); }
  }, 300);
}
function pickCat(c){ cat = c; fetchItems(true); scrollTo(0, 0); }
function goHome(){ cat = ''; q = ''; document.getElementById('q').value = ''; seq++; busy = false; items = []; view(); scrollTo(0, 0); }

async function loadShops(reset){
  const from = reset ? 0 : shopsList.length;
  const {data, error} = await sb.from('shops').select('owner,name,category').eq('public_market', true)
    .order('name').order('owner').range(from, from + SPAGE - 1);
  if (error) { err = error.message; view(); return; }
  shopsList = reset ? data : shopsList.concat(data); shopsMore = data.length === SPAGE;
}
async function moreShops(){ await loadShops(false); view(); }
async function loadHome(){
  const [c] = await Promise.all([sb.rpc('market_category_counts'), loadShops(true)]);
  if (c.error) { err = c.error.message; view(); return; }
  err = ''; counts = c.data; view();
}
loadHome();
setInterval(() => { if (!document.hidden && !cat && !q.trim()) sb.rpc('market_category_counts').then(c => { if (!c.error && !cat && !q.trim()) { counts = c.data; view(); } }); }, 90000);
</script>
</body>
</html>
