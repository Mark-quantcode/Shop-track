<!doctype html>
<html lang="en">
<head>
<link rel="manifest" href="manifest.json">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://inugsmnlodvfsbkpxuyb.supabase.co; connect-src 'self' https://inugsmnlodvfsbkpxuyb.supabase.co wss://inugsmnlodvfsbkpxuyb.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'; manifest-src 'self'; worker-src 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Brinvoq</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#16202a;--mut:#6b7785;--pri:#0f766e;--bad:#c2410c;--ok:#15803d;--line:#e3e8ee}
@media(prefers-color-scheme:dark){:root{--bg:#10151a;--card:#1a2129;--ink:#eef2f6;--mut:#93a1b0;--pri:#2dd4bf;--bad:#fb923c;--ok:#4ade80;--line:#2a343f}}
*{box-sizing:border-box}
body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:80px}
header{background:var(--pri);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
@media(prefers-color-scheme:dark){header{color:#06201d}}
.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700}
.brand img{width:30px;height:30px;border-radius:8px;object-fit:cover}
.avatar{width:36px;height:36px;border-radius:50%;border:2px solid currentColor;background:transparent;color:inherit;font-size:16px;font-weight:700;padding:0}
main{padding:14px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat small{color:var(--mut);display:block}
.stat b{font-size:20px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
input,select{width:100%;padding:12px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
button.p{width:100%;margin-top:12px;padding:13px;font-size:16px;font-weight:600;border:0;border-radius:10px;background:var(--pri);color:#fff}
@media(prefers-color-scheme:dark){button.p{color:#06201d}}
button.p.o{background:transparent;color:var(--pri);border:1px solid var(--pri)}
button.p.g{background:transparent;color:var(--mut);border:1px solid var(--line)}
button.s{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:6px 10px;font-size:13px;margin-left:6px}
button.s.d{color:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:8px}
.row:last-child{border:0}
.row small{color:var(--mut);display:block}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:12px 0;border:0;background:transparent;color:var(--mut);font-size:11px}
nav button.on{color:var(--pri);font-weight:700}
h3{margin:4px 0 8px}
#toast{position:fixed;left:12px;right:12px;bottom:90px;padding:12px 14px;border-radius:10px;font-size:15px;z-index:20;display:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#toast.show{display:block}#toast.e{background:#991b1b;color:#fff}#toast.g{background:#166534;color:#fff}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
@media(prefers-color-scheme:dark){.tabs button.on{color:#06201d}}
/* dashboard */
.hero{background:linear-gradient(135deg,#0f766e,#134e4a);color:#fff;border-radius:16px;padding:18px;margin-bottom:12px}
.hero h2{margin:0 0 2px;font-size:22px}
.hero p{margin:0;opacity:.85;font-size:14px}
.hero .big{margin-top:14px;font-size:13px;opacity:.85}
.hero .big b{display:block;font-size:28px;opacity:1}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.qa button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 4px;color:var(--ink);font-size:13px;font-weight:600}
.qa button span{display:block;font-size:22px;margin-bottom:4px}
.bars{display:flex;align-items:flex-end;gap:8px;height:96px;margin-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.bars i{display:block;width:100%;background:var(--pri);border-radius:6px 6px 2px 2px;opacity:.85;min-height:3px}
.bars i.t{opacity:1}
.bars small{color:var(--mut);font-size:11px}
.steps{margin:0;padding-left:20px;color:var(--mut);line-height:1.7}
.tog{display:flex;gap:6px;margin:10px 0 4px}
.tog button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--mut);font-weight:600}
.tog button.on{background:var(--pri);border-color:var(--pri);color:#fff}
@media(prefers-color-scheme:dark){.tog button.on{color:#06201d}}
.logo{display:block;width:64px;height:64px;border-radius:16px;margin:4px 0 8px;object-fit:cover}
.thumb{width:48px;height:48px;border-radius:8px;object-fit:cover;flex:none;display:block}
.thumb.ph{display:flex;align-items:center;justify-content:center;background:var(--bg);font-size:22px}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 4px}.prog i{display:block;height:100%;background:var(--pri);border-radius:99px}
.more{display:flex;align-items:center;gap:12px;width:100%;padding:14px 4px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);text-align:left;font:inherit}
.more:last-child{border:0}.more small{display:block;color:var(--mut)}.more .ic{font-size:24px}.more .ch{margin-left:auto;color:var(--mut);font-size:22px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--mut);vertical-align:middle}
/* live animated background */
.live-bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blob{position:absolute;width:70vmax;height:70vmax;border-radius:50%;opacity:.28;will-change:transform;animation:drift 22s ease-in-out infinite alternate}
.blob.b1{background:radial-gradient(circle,#14b8a6 0%,transparent 65%);top:-25vmax;left:-20vmax}
.blob.b2{background:radial-gradient(circle,#fb923c 0%,transparent 65%);bottom:-30vmax;right:-25vmax;animation-duration:28s;animation-delay:-8s}
.blob.b3{background:radial-gradient(circle,#2dd4bf 0%,transparent 65%);top:30%;left:35%;width:50vmax;height:50vmax;opacity:.18;animation-duration:34s;animation-delay:-15s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(8vmax,6vmax) scale(1.12)}100%{transform:translate(-6vmax,10vmax) scale(.95)}}
@media(prefers-color-scheme:dark){.blob{opacity:.2}.blob.b3{opacity:.12}}
@media(prefers-reduced-motion:reduce){.blob{animation:none}}
.card{background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
</style>
</head>
<body>
<div class="live-bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>
<div id="app"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ====== SUPABASE DETAILS (Project Settings > API) ======
const SUPABASE_URL = 'https://inugsmnlodvfsbkpxuyb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_cj84eL5811FNFUBZ-xtAXw_5A7-w4KX';
// ========================================================

const CONFIGURED = /^https?:\/\//.test(SUPABASE_URL) && SUPABASE_KEY.length > 20 && !SUPABASE_KEY.startsWith('PASTE');
const sb = CONFIGURED ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
// only ever show photos that live in our own storage folder
const IMG_PREFIX = SUPABASE_URL + '/storage/v1/object/public/listing-images/';
const safeImg = u => (typeof u === 'string' && u.startsWith(IMG_PREFIX)) ? u : '';
const S = { user:null, view:'home', products:[], sales:[], expenses:[], period:'today', editing:null, authMode:'in',
  shop:null, listings:[], catalogErr:null, editingL:null,
  goals:[], sav:[], savErr:null, savKind:'deposit',
  stockQ:'', stockShow:50, sellQ:'', lq:'', lcount:0, lmore:false, listedIds:new Set(), fq:'', fshow:20 };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => 'KSh ' + Number(n || 0).toLocaleString('en-KE', {maximumFractionDigits:2});
const sod = (d = new Date()) => { const x = new Date(d); x.setHours(0,0,0,0); return x; };

function periodStart(p){
  const t = sod();
  if (p === 'week') t.setDate(t.getDate() - 6);
  if (p === 'month') t.setDate(1);
  return t;
}
function inPeriod(row, p){ return new Date(row.created_at) >= periodStart(p); }
function flash(text, type='g'){
  const t = $('toast'); t.textContent = text; t.className = 'show ' + type;
  clearTimeout(flash.t); flash.t = setTimeout(() => { t.className = ''; }, 4000);
}

// ---------- Name & greeting ----------
function displayName(u = S.user){
  const un = (u?.user_metadata?.username || '').trim();
  if (un) return un;
  const local = (u?.email || '').split('@')[0] || '';
  const word = (local.match(/^[A-Za-z]+/) || [local])[0];
  return word ? word.charAt(0).toUpperCase() + word.slice(1).toLowerCase() : 'there';
}
function greeting(){
  const h = new Date().getHours();
  return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
}
const todayLabel = () => new Date().toLocaleDateString('en-KE', {weekday:'long', day:'numeric', month:'long'});

// Supabase returns at most 1000 rows per request, so read big tables page by page.
async function fetchAll(make, max = 20000){
  const out = [], step = 1000;
  for (let from = 0; from < max; from += step) {
    const {data, error} = await make().range(from, from + step - 1);
    if (error) return {error};
    out.push(...data);
    if (data.length < step) break;
  }
  return {data: out};
}

async function load(){
  const since = new Date(); since.setDate(since.getDate() - 62);
  const [p, s, e] = await Promise.all([
    fetchAll(() => sb.from('products').select('*').order('name').order('id')),
    fetchAll(() => sb.from('sales').select('*').gte('created_at', since.toISOString()).order('created_at', {ascending:false}).order('id')),
    fetchAll(() => sb.from('expenses').select('*').gte('created_at', since.toISOString()).order('created_at', {ascending:false}).order('id'))
  ]);
  if (p.error || s.error || e.error) return flash((p.error||s.error||e.error).message, 'e');
  S.products = p.data; S.sales = s.data; S.expenses = e.data;
  render();
  loadCatalog();
  loadSavings();
}

// ---------- Auth ----------
function setMode(m){
  const em = $('em')?.value || '', pw = $('pw')?.value || '', un = $('un')?.value || '';
  S.authMode = m; render();
  $('em').value = em; $('pw').value = pw; if ($('un')) $('un').value = un;
}
function authView(){
  const up = S.authMode === 'up';
  return `<main><div class="card">
  <img class="logo" src="icon-192.png" alt="">
  <h3>ShopTrack</h3>
  <small style="color:var(--mut)">Stock, sales and expenses in your pocket.</small>
  <div class="tog"><button class="${up?'':'on'}" onclick="setMode('in')">Sign in</button><button class="${up?'on':''}" onclick="setMode('up')">Create account</button></div>
  ${up ? `<label>Username (shown in your greeting)</label><input id="un" maxlength="20" autocomplete="nickname" placeholder="e.g. Mark">` : ''}
  <label>Email</label><input id="em" type="email" autocomplete="email">
  <label>Password (min 8 characters)</label><input id="pw" type="password" autocomplete="${up?'new-password':'current-password'}">
  <button class="p" onclick="${up?'signUp()':'signIn()'}">${up?'Create account':'Sign in'}</button>
  <p style="text-align:center;margin:16px 0 0"><a href="market.html" style="color:var(--pri);font-weight:600;text-decoration:none">🛍️ Buying? Browse the marketplace</a></p>
  </div></main>`;
}
async function signIn(){
  const {error} = await sb.auth.signInWithPassword({email:$('em').value.trim(), password:$('pw').value});
  if (error) flash(error.message, 'e');
}
async function signUp(){
  const username = ($('un').value || '').trim();
  if (username.length < 2) return flash('Choose a username (at least 2 characters).', 'e');
  if ($('pw').value.length < 8) return flash('Use a password of at least 8 characters.', 'e');
  const {data, error} = await sb.auth.signUp({
    email:$('em').value.trim(), password:$('pw').value,
    options:{ data:{ username } }
  });
  if (error) return flash(error.message, 'e');
  if (!data.session) { S.authMode = 'in'; render(); flash('Account created. Check your email to confirm, then sign in.'); }
}
async function signOut(){ await sb.auth.signOut(); }

// ---------- Views ----------
function weekBars(){
  const days = [];
  for (let i = 6; i >= 0; i--) { const d = sod(); d.setDate(d.getDate() - i); days.push({d, total:0}); }
  S.sales.forEach(r => {
    const k = sod(r.created_at).getTime();
    const day = days.find(x => x.d.getTime() === k);
    if (day) day.total += Number(r.total_amount);
  });
  const max = Math.max(...days.map(x => x.total), 1);
  return `<div class="bars">${days.map((x,i) => `<div title="${money(x.total)}"><i class="${i===6?'t':''}" style="height:${Math.max(3, x.total/max*100)}%"></i><small>${x.d.toLocaleDateString('en-KE',{weekday:'narrow'})}</small></div>`).join('')}</div>`;
}

function homeView(){
  const ts = S.sales.filter(r => inPeriod(r,'today')), te = S.expenses.filter(r => inPeriod(r,'today'));
  const sales = ts.reduce((a,r)=>a+Number(r.total_amount),0);
  const profit = ts.reduce((a,r)=>a+Number(r.profit),0);
  const exp = te.reduce((a,r)=>a+Number(r.amount),0);
  const net = profit - exp;
  const low = S.products.filter(p => p.stock_qty <= p.low_stock_alert);
  const stockValue = S.products.reduce((a,p)=>a+Number(p.buying_price)*Number(p.stock_qty),0);
  const recent = S.sales.slice(0,5);
  const hero = `<div class="hero"><h2>${greeting()}, ${esc(displayName())} 👋</h2><p>${todayLabel()}</p>
    <div class="big">Today's sales<b>${money(sales)}</b>${ts.length} sale${ts.length===1?'':'s'} recorded</div></div>`;
  const qa = `<div class="qa">
    <button onclick="go('sell')"><span>🛒</span>Sell</button>
    <button onclick="go('stock')"><span>📦</span>Add product</button>
    <button onclick="go('exp')"><span>💸</span>Add expense</button></div>`;
  if (!S.products.length) {
    return hero + `<div class="card"><h3>Get started</h3>
      <ol class="steps"><li>Add your products in <b>Stock</b></li><li>Record sales as they happen in <b>Sell</b></li><li>Log costs like rent and transport in <b>Expenses</b></li><li>Watch your profit here and in <b>Reports</b></li></ol>
      <button class="p" onclick="go('stock')">Add your first product</button></div>`;
  }
  return hero + qa + `<div class="card"><h3>Today</h3><div class="grid">
    <div class="stat"><small>Gross profit</small><b class="ok">${money(profit)}</b></div>
    <div class="stat"><small>Expenses</small><b class="bad">${money(exp)}</b></div>
    <div class="stat"><small>Net profit</small><b class="${net>=0?'ok':'bad'}">${money(net)}</b></div>
    <div class="stat"><small>Stock value (at cost)</small><b>${money(stockValue)}</b></div></div></div>
  <div class="card"><h3>Last 7 days</h3><small style="color:var(--mut)">Daily sales</small>${weekBars()}</div>
  <div class="card"><h3>Low stock ${low.length ? '('+low.length+')' : ''}</h3>
  ${low.length ? low.slice(0,10).map(p=>`<div class="row"><span>${esc(p.name)}</span><b class="bad">${p.stock_qty} left</b></div>`).join('') + (low.length > 10 ? `<small style="color:var(--mut)">+ ${low.length - 10} more. See the Stock tab.</small>` : '') : '<small style="color:var(--mut)">Everything is well stocked.</small>'}</div>
  <div class="card"><h3>Recent sales</h3>
  ${recent.map(r=>`<div class="row"><div><b>${esc(r.product_name)} × ${r.quantity}</b><small>${new Date(r.created_at).toLocaleString()}</small></div><b>${money(r.total_amount)}</b></div>`).join('') || '<small style="color:var(--mut)">No sales yet. Tap Sell to record your first.</small>'}</div>`;
}
function go(v){ S.view = v; S.editing = null; render(); scrollTo(0,0); if (v === 'sav') loadSavings(); }

function sellOptions(){
  const q = S.products.length > 8 ? S.sellQ.trim().toLowerCase() : '';
  const m = S.products.filter(p => !q || String(p.name).toLowerCase().includes(q));
  if (!m.length) return '<option value="">No product matches</option>';
  return m.slice(0, 50).map(p => `<option value="${p.id}">${esc(p.name)} (${p.stock_qty} in stock)</option>`).join('')
    + (m.length > 50 ? `<option value="" disabled>… ${m.length - 50} more. Type to narrow the list.</option>` : '');
}
function sellFilter(v){ S.sellQ = v; $('sp').innerHTML = sellOptions(); fillPrice(); }
function sellView(){
  if (!S.products.length) return `<div class="card">Add products in the Stock tab first.</div>`;
  return `<div class="card"><h3>Record a sale</h3>
  <label>Product</label>
  ${S.products.length > 8 ? `<input id="sq0" type="search" placeholder="Type to find a product" value="${esc(S.sellQ)}" oninput="sellFilter(this.value)" style="margin-bottom:8px">` : ''}
  <select id="sp" onchange="fillPrice()">${sellOptions()}</select>
  <label>Quantity</label><input id="sq" type="number" inputmode="numeric" min="1" value="1">
  <label>Selling price each</label><input id="su" type="number" inputmode="decimal" min="0" step="any">
  <label>Recorded by</label><input id="sr" value="${esc(displayName())}">
  <button class="p" onclick="addSale()">Save sale</button></div>`;
}
function fillPrice(){
  const p = S.products.find(x => x.id === $('sp').value);
  if (p) $('su').value = p.selling_price;
}
async function addSale(){
  if (!$('sp').value) return flash('Choose a product.', 'e');
  const qty = parseInt($('sq').value, 10), price = parseFloat($('su').value);
  if (!(qty > 0)) return flash('Enter a quantity of 1 or more.', 'e');
  if (!(price >= 0)) return flash('Enter a valid price.', 'e');
  const {error} = await sb.from('sales').insert({
    product_id: $('sp').value, quantity: qty, unit_price: price, recorded_by: $('sr').value.trim() || 'Owner'
  });
  if (error) return flash(error.message, 'e');
  await load(); flash('Sale saved.');
}

function stockView(){
  const e = S.editing ? S.products.find(p => p.id === S.editing) : null;
  return `<div class="card"><h3>${e ? 'Edit product' : 'Add product'}</h3>
  <label>Name</label><input id="pn" value="${esc(e?.name)}">
  <div class="grid"><div><label>Buying price</label><input id="pb" type="number" inputmode="decimal" step="any" value="${e?.buying_price ?? ''}"></div>
  <div><label>Selling price</label><input id="ps" type="number" inputmode="decimal" step="any" value="${e?.selling_price ?? ''}"></div>
  <div><label>Stock quantity</label><input id="pq" type="number" inputmode="numeric" value="${e?.stock_qty ?? ''}"></div>
  <div><label>Low-stock alert at</label><input id="pl" type="number" inputmode="numeric" value="${e?.low_stock_alert ?? 5}"></div></div>
  <button class="p" onclick="saveProduct()">${e ? 'Update' : 'Add product'}</button>
  ${e ? `<button class="p g" onclick="S.editing=null;render()">Cancel</button>` : ''}</div>
  <div class="card" id="plist">${productListHtml()}</div>`;
}
function productFiltered(){
  const q = S.stockQ.trim().toLowerCase();
  return q ? S.products.filter(p => String(p.name).toLowerCase().includes(q)) : S.products;
}
function productListHtml(){
  const m = productFiltered(), shown = m.slice(0, S.stockShow);
  return `<h3>Products (${S.products.length})</h3>
  ${S.products.length > 8 ? `<input id="stq" type="search" placeholder="Search products…" value="${esc(S.stockQ)}" oninput="stockSearch(this.value)" style="margin-bottom:8px">` : ''}
  ${shown.map(p=>`<div class="row"><div><b>${esc(p.name)}</b><small>Buy ${money(p.buying_price)} · Sell ${money(p.selling_price)}</small></div>
    <div style="text-align:right"><b class="${p.stock_qty<=p.low_stock_alert?'bad':''}">${p.stock_qty}</b>
    <div><button class="s" onclick="S.editing='${p.id}';render();scrollTo(0,0)">Edit</button><button class="s d" onclick="delProduct('${p.id}')">Del</button></div></div></div>`).join('')
    || `<small style="color:var(--mut)">${S.products.length ? 'No product matches.' : 'No products yet.'}</small>`}
  ${m.length > shown.length ? `<button class="p g" onclick="S.stockShow+=50;refreshProducts()">Show more (${m.length - shown.length} left)</button>` : ''}`;
}
function refreshProducts(){ const el = $('plist'); if (el) el.innerHTML = productListHtml(); }
function stockSearch(v){
  S.stockQ = v; S.stockShow = 50; refreshProducts();
  const el = $('stq'); if (el) { el.focus(); el.setSelectionRange(v.length, v.length); }
}
async function saveProduct(){
  const row = {
    name: $('pn').value.trim(), buying_price: parseFloat($('pb').value) || 0, selling_price: parseFloat($('ps').value) || 0,
    stock_qty: parseInt($('pq').value, 10) || 0, low_stock_alert: parseInt($('pl').value, 10) || 0
  };
  if (!row.name) return flash('Product name is required.', 'e');

// shrink photos on the phone before uploading (saves data)
function compressImage(file, max = 800, q = 0.8){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('Could not process the photo.')), 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Could not read that photo.')); };
    img.src = url;
  });
}
async function uploadImage(file){
  const blob = await compressImage(file);
  const path = `${S.user.id}/${crypto.randomUUID()}.jpg`;
  const {error} = await sb.storage.from(IMG_BUCKET).upload(path, blob, {contentType:'image/jpeg'});
  if (error) throw error;
  return sb.storage.from(IMG_BUCKET).getPublicUrl(path).data.publicUrl;
}
function removeImage(url){
  const part = String(url || '').split('/' + IMG_BUCKET + '/')[1];
  if (part) sb.storage.from(IMG_BUCKET).remove([decodeURIComponent(part.split('?')[0])]).then(() => {});
}

async function loadCatalog(){

  const [sh, cnt, ids] = await Promise.all([
    sb.from('shops').select('*').eq('owner', S.user.id).maybeSingle(),
    sb.from('listings').select('id', {count:'exact', head:true}).eq('owner', S.user.id),
    fetchAll(() => sb.from('listings').select('product_id').eq('owner', S.user.id).not('product_id', 'is', null).order('id'))
  ]);
  if (sh.error || cnt.error || ids.error) { S.catalogErr = (sh.error || cnt.error || ids.error).message; S.shop = null; S.listings = []; render(); return; }
  S.catalogErr = null; S.shop = sh.data; S.lcount = cnt.count || 0;

async function loadListings(reset, partial){
  const from = reset ? 0 : S.listings.length;
  let qy = sb.from('listings').select('*').eq('owner', S.user.id);
  const term = S.lq.replace(/[%_\\,()]/g, ' ').trim();
  if (term) qy = qy.ilike('name', '%' + term + '%');
  qy = qy.order('created_at', {ascending:false}).order('id').range(from, from + LPAGE - 1);
  const {data, error} = await qy;
  if (error) { S.catalogErr = error.message; render(); return; }
  S.listings = reset ? data : S.listings.concat(data);
  S.lmore = data.length === LPAGE;
  if (partial || !reset) refreshListings(); else render();
}

    ${dep ? (net > 0
      ? `<small style="color:var(--mut);display:block;margin-top:6px">Your net profit this month is <b class="ok">${money(net)}</b>. Quick amounts:
         <button class="s" onclick="suggestSave(0.1)">10%</button><button class="s" onclick="suggestSave(0.2)">20%</button><button class="s" onclick="suggestSave(0.3)">30%</button></small>`
      : `<small style="color:var(--mut);display:block;margin-top:6px">No net profit recorded this month yet.</small>`) : ''}
    <label>Note (optional)</label><input id="svn" maxlength="80" placeholder="e.g. Sent to M-Shwari">
    <button class="p" onclick="addSaving()">${dep ? 'Save money' : 'Record withdrawal'}</button></div>` : '';

  const provCard = S.goals.length ? `<div class="card"><h3>Balance by provider</h3>
    ${Object.entries(byProv).sort((a, b) => b[1] - a[1]).map(([p, v]) => `<div class="row"><span>${esc(p)}</span><b>${money(v)}</b></div>`).join('')}
    <small style="color:var(--mut)">These are the amounts you record here. ShopTrack cannot read your M-PESA or bank balance, so record each deposit and withdrawal to keep it accurate.</small></div>` : '';

  const newGoal = `<div class="card"><h3>New savings goal</h3>
    <label>Goal name</label><input id="gn" maxlength="40" placeholder="e.g. New fridge, Rent buffer, Emergency">
    <label>Target amount (optional)</label><input id="gt" type="number" inputmode="decimal" min="0" step="any">
    <label>Where will you keep it?</label><select id="gp">${provOptions('M-Shwari')}</select>
    <button class="p" onclick="addGoal()">Create goal</button></div>`;

  const hist = S.sav.slice(0, 10);
  const histCard = hist.length ? `<div class="card"><h3>Recent activity</h3>
    ${hist.map(x => `<div class="row"><div><b>${esc(goalName(x.goal_id))}</b><small>${new Date(x.created_at).toLocaleString()}${x.note ? ' · ' + esc(x.note) : ''}</small></div>
      <b class="${x.kind === 'deposit' ? 'ok' : 'bad'}">${x.kind === 'deposit' ? '+' : '−'}${money(x.amount)}</b></div>`).join('')}</div>` : '';

  const options = `<div class="card"><h3>Where you can save</h3>
    ${PROVIDERS.filter(p => p[2]).map(p => `<div class="row"><div><b>${esc(p[0])}</b> <span class="badge">${esc(p[1])}</span><small>${esc(p[2])}</small></div></div>`).join('')}
    <small style="color:var(--mut);display:block;margin-top:8px">These are options, not recommendations. Rates, fees and rules change, so check them with the provider before you save.</small></div>`;

  return hero + (S.goals.length ? S.goals.map(goalCard).join('') : '<div class="card"><small style="color:var(--mut)">No goals yet. Create your first one below.</small></div>')
    + moveCard + provCard + newGoal + histCard + options;
}

async function addGoal(){
  const name = $('gn').value.trim(), tv = $('gt').value, provider = $('gp').value;
  const target = tv === '' ? null : parseFloat(tv);
  if (!name) return flash('Name your goal, for example New fridge.', 'e');
  if (target !== null && !(target >= 0)) return flash('Enter a valid target.', 'e');
  const {error} = await sb.from('savings_goals').insert({name, target, provider});
  if (error) return flash(error.message, 'e');
  await loadSavings(); flash('Goal created.');
}
async function addSaving(){
  const goal_id = $('svg')?.value, amount = parseFloat($('sva').value), note = $('svn').value.trim() || null;
  const kind = S.savKind === 'withdraw' ? 'withdraw' : 'deposit';
  if (!goal_id) return flash('Create a goal first.', 'e');
  if (!(amount > 0)) return flash('Enter an amount above 0.', 'e');
  const {error} = await sb.from('savings_entries').insert({goal_id, kind, amount, note});
  if (error) return flash(error.message, 'e');
  await loadSavings(); flash(kind === 'deposit' ? 'Saved. Well done!' : 'Withdrawal recorded.');
}
async function delGoal(id){
  const g = S.goals.find(x => x.id === id);
  const warn = g && Number(g.saved) > 0 ? ` It holds ${money(g.saved)}. Withdraw it first if you want to keep a record.` : '';
  if (!confirm('Delete this goal and its history?' + warn)) return;
  const {error} = await sb.from('savings_goals').delete().eq('id', id);
  if (error) return flash(error.message, 'e');
  await loadSavings();
}

function profileView(){
  return `<div class="card"><h3>Your profile</h3>
  <label>Email</label><input value="${esc(S.user.email)}" disabled>
  <label>Username (shown in your greeting)</label><input id="pu" maxlength="20" value="${esc(S.user.user_metadata?.username || '')}" placeholder="${esc(displayName())}">
  <button class="p" onclick="saveProfile()">Save username</button>
  <button class="p o" onclick="signOut()">Sign out</button></div>`;
}
async function saveProfile(){
  const username = $('pu').value.trim();
  if (username.length < 2) return flash('Username must be at least 2 characters.', 'e');
  const {data, error} = await sb.auth.updateUser({data:{username}});
  if (error) return flash(error.message, 'e');
  S.user = data.user; flash('Username saved.'); go('home');
}

// ---------- Shell ----------
function render(){
  const app = $('app');
  if (!S.user) { app.innerHTML = authView(); return; }
  const views = {home:homeView, sell:sellView, stock:stockView, exp:expensesView, rep:reportsView, cat:catalogView, sav:savingsView, more:moreView, me:profileView};
  const nav = [['home','🏠','Home'],['sell','🛒','Sell'],['stock','📦','Stock'],['cat','🌐','Online'],['more','☰','More']];
  const moreSet = ['more','exp','rep','sav','me'];
  app.innerHTML = `<header><div class="brand"><img src="icon-192.png" alt="">ShopTrack</div>
  <button class="avatar" onclick="go('me')" aria-label="Profile">${esc(displayName().charAt(0).toUpperCase())}</button></header>
  <main>${views[S.view]()}</main>
  <nav>${nav.map(([k,i,l])=>`<button class="${(S.view===k || (k==='more' && moreSet.includes(S.view)))?'on':''}" onclick="go('${k}')">${i}<br>${l}</button>`).join('')}</nav>`;
  if (S.view === 'sell' && $('sp') && !$('su').value) fillPrice();
}

if (!CONFIGURED) {
  $('app').innerHTML = `<main><div class="card"><h3>Setup needed</h3>
  <p>Open <b>index.html</b> in a text editor and replace the Supabase URL and key near the top with the values from Supabase → Project Settings → API. Keep the quotes.</p></div></main>`;
} else {
  let lastUid = null;
  sb.auth.onAuthStateChange((_e, session) => {
    // setTimeout avoids a supabase-js deadlock when calling the API inside this callback
    setTimeout(() => {
      S.user = session?.user ?? null;
      if (S.user) { if (S.user.id !== lastUid) { lastUid = S.user.id; S.view = 'home'; load(); } }
      else { lastUid = null; S.products = []; S.sales = []; S.expenses = []; S.goals = []; S.sav = []; render(); }
    }, 0);
  });
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
}
</script>
</body>
</html>
